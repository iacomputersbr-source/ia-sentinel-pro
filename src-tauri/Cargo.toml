[package]
name = "ia-sentinel-pro"
version = "2.0.0"
description = "IA Sentinel Pro"
edition = "2021"
authors = ["IAComputersBR"]
repository = ""
default-run = "ia-sentinel-pro"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["api-all"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
