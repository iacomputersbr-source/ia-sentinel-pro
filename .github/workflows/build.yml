name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arreglar carpeta triple anidada
        shell: powershell
        run: |
          Write-Host "Buscando package.json..."
          Get-ChildItem -Recurse -Filter package.json | Select-Object FullName
          $pkg = Get-ChildItem -Recurse -Filter package.json -File | Where-Object { $_.FullName -notlike "*node_modules*" } | Select-Object -First 1
          if (-not $pkg) { Write-Host "NO SE ENCONTRO package.json"; exit 1 }
          Write-Host "ENCONTRADO EN: $($pkg.FullName)"
          Write-Host "Copiando de $($pkg.DirectoryName) a $env:GITHUB_WORKSPACE"
          Copy-Item "$($pkg.DirectoryName)/*" -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          Write-Host "Ahora en raiz:"
          dir
      - name: Crear iconos
        shell: powershell
        run: |
          mkdir src-tauri/icons -Force -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing
          $b=New-Object System.Drawing.Bitmap 512,512
          $g=[System.Drawing.Graphics]::FromImage($b)
          $g.Clear([System.Drawing.Color]::Black)
          $b.Save("src-tauri/icons/icon.png")
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/32x32.png" -Force
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128.png" -Force
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128@2x.png" -Force
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/icon.ico" -Force
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Sentinel-EXE
          path: src-tauri/target/release/bundle/msi/*.msi
