name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nested folder
        shell: powershell
        run: |
          $found = Get-ChildItem -Recurse -Filter package.json | Select-Object -First 1
          $srcDir = $found.Directory.FullName
          if ($srcDir -ne (Get-Location).Path) { Copy-Item "$srcDir/*" -Destination. -Recurse -Force }
      - name: Crear iconos
        shell: powershell
        run: |
          mkdir src-tauri/icons -Force
          Add-Type -AssemblyName System.Drawing
          $b=New-Object System.Drawing.Bitmap 512,512
          $g=[System.Drawing.Graphics]::FromImage($b)
          $g.Clear([System.Drawing.Color]::Black)
          $b.Save("src-tauri/icons/icon.png")
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/32x32.png"
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128.png"
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128@2x.png"
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/icon.ico"
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Sentinel-EXE
          path: src-tauri/target/release/bundle/mSi/*.msi
