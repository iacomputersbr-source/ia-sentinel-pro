name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear iconos
        shell: powershell
        run: |
          mkdir src-tauri/icons -Force
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Black)
          $g.FillRectangle([System.Drawing.Brushes]::Orange, 50,50,156,156)
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/32x32.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/128x128.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Save("src-tauri/icons/128x128@2x.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $s = [System.IO.File]::Create("src-tauri/icons/icon.ico"); $icon.Save($s); $s.Close()
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - name: Ver que se creo
        shell: powershell
        run: |
          Write-Host "=== BUNDLE ==="
          dir src-tauri/target/release/bundle -Recurse -Force
          Write-Host "=== EXE ==="
          dir src-tauri/target/release/*.exe
      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: IA-Sentinel-EXE
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
