name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear iconos validos
        shell: powershell
        run: |
          mkdir src-tauri/icons -Force
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Black)
          $g.FillRectangle([System.Drawing.Brushes]::Orange, 50,50,156,156)
          $bmp.Save("src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/32x32.png" -Force
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128.png" -Force
          Copy-Item "src-tauri/icons/icon.png" "src-tauri/icons/128x128@2x.png" -Force
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($stream)
          $stream.Close()
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build
      - name: Listar bundle
        shell: powershell
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: IA-Sentinel-EXE
          path: src-tauri/target/release/bundle/
